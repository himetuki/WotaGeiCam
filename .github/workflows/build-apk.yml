# 打包安卓四件套（monorepo 版，Gradle 根在 Android/WotaGeiCamApp/）
# 产物：WotaGeiCam-v<版本>[-r<NN>]-release-Android.apk / -universal-release-Android.apk /
#       -arm64-v8a-release-Android.apk / -armeabi-v7a-release-Android.apk
#       （版本号取自 versionName；扩展名前平台后缀 -Android，与鸿蒙的 -Harmony 资产区分）
# r 号：tag 格式 v<版本>-r<检查点>（如 v0.0.7-r08）时，r 段经 -Prbuild 传给 Gradle，
#   产物名与设置页"版本"显示携带 r 号；无 -r 后缀或不填 dispatch input 则不传。
# 触发：推送 v* 标签（与 build-hap.yml 共用同一个 tag，两条流水线并行，资产进同一个 Release）；
#   也可在 Actions 页手动触发（可选输入 rbuild）。
# 签名：keystore 与密码不进 git，启动时从 Actions Secrets 还原——
#   WOTA_KEYSTORE_BASE64 = 发布 keystore 的 base64（单行）
#   WOTA_KEYSTORE_PROPS  = keystore.properties 的完整文本
name: Build Release APKs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      rbuild:
        description: "r 检查点号（如 08；留空=版本名不带 r 后缀）"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;33.0.1" > /dev/null

      - name: Restore signing config from Actions Secrets
        env:
          WOTA_KEYSTORE_BASE64: ${{ secrets.WOTA_KEYSTORE_BASE64 }}
          WOTA_KEYSTORE_PROPS: ${{ secrets.WOTA_KEYSTORE_PROPS }}
        run: |
          mkdir -p Android/WotaGeiCamApp/keystore
          printf '%s' "$WOTA_KEYSTORE_BASE64" | base64 -d > Android/WotaGeiCamApp/keystore/wotageicam-release.jks
          printf '%s\n' "$WOTA_KEYSTORE_PROPS" > Android/WotaGeiCamApp/keystore.properties

      # gradle.properties 里的 org.gradle.java.home 是本机 JDK 绝对路径，CI 上不存在，删掉后用
      # setup-java 的 JAVA_HOME；gradlew 在库里是 100644，Linux 上必须补 chmod。
      - name: Strip machine-specific gradle.properties and chmod gradlew
        run: |
          sed -i '/^org.gradle.java.home/d' Android/WotaGeiCamApp/gradle.properties
          chmod +x Android/WotaGeiCamApp/gradlew

      # r 段提取：tag v0.0.7-r08 → EXTRA_PROPS="-Prbuild=08"；无 -r 后缀 → 不传；
      # 手动触发用 input rbuild。
      - name: Derive -Prbuild from tag r-segment or dispatch input
        env:
          RBUILD_INPUT: ${{ inputs.rbuild }}
        run: |
          RBUILD=""
          if [ "${GITHUB_REF_TYPE:-branch}" = "tag" ]; then
            case "$GITHUB_REF_NAME" in
              *-r*) RBUILD="${GITHUB_REF_NAME##*-r}" ;;
            esac
          else
            RBUILD="$RBUILD_INPUT"
          fi
          if [ -n "$RBUILD" ]; then
            echo "EXTRA_PROPS=-Prbuild=$RBUILD" >> "$GITHUB_ENV"
          else
            echo "EXTRA_PROPS=" >> "$GITHUB_ENV"
          fi

      # 第一遍：ABI 分包（universal + arm64-v8a + armeabi-v7a 三枚）
      # 注意：两遍配置不同（分包开/关），后一遍会把前一遍的产物从 outputs 里清掉，
      # 所以每遍跑完立刻拷进 apk-out 暂存，最后统一校验。
      # apkBaseName=WotaGeiCam：Gradle 产物名 WotaGeiCam-v<版本>-*.apk（用户 10-25 裁决：
      # 资产名必须带项目名）。下面 Rename 步骤统一改为 WotaGeiCam-v<版本>-*-Android.apk。
      - name: Build split APKs (full / lite × universal / arm64-v8a / armeabi-v7a)
        working-directory: Android/WotaGeiCamApp
        run: |
          ./gradlew :app:assembleFullRelease :app:assembleLiteRelease -PabiSplits=true -PapkBaseName=WotaGeiCam $EXTRA_PROPS --stacktrace
          mkdir -p ../../apk-out
          # Gradle 产物名已含 flavor 段（WotaGeiCam-v<ver>-<flavor>[-<abi>]-release.apk），
          # cp 不得再追加 -$d——否则名变 -full-universal-release-full-（双段），
          # 下游 Publish 定位 universal 与更新器资产匹配都会错位。
          for d in full lite; do
            for f in app/build/outputs/apk/$d/release/*.apk; do
              cp "$f" "../../apk-out/"
            done
          done

      # 第二遍：不分包的普通 release（复用编译缓存，只重新打包，很快）
      - name: Build plain release APKs (full / lite)
        working-directory: Android/WotaGeiCamApp
        run: |
          ./gradlew :app:assembleFullRelease :app:assembleLiteRelease -PapkBaseName=WotaGeiCam $EXTRA_PROPS --stacktrace
          for d in full lite; do
            for f in app/build/outputs/apk/$d/release/*.apk; do
              cp "$f" "../../apk-out/"
            done
          done

      # 统一改名（产物最终名）：WotaGeiCam-v0.0.11-r01-release.apk → WotaGeiCam-v0.0.11-r01-release-Android.apk。
      # 剥 WotaGeiCam- 暂存前缀、在 .apk 前插平台后缀 -Android；Gradle 侧 apkBaseName 保持不动。
      - name: Rename APKs to platform-suffixed names
        run: |
          set -euo pipefail
          shopt -s nullglob
          renamed=0
          for f in apk-out/WotaGeiCam-v*.apk; do
            base="${f##*/}"
            base="${base#WotaGeiCam-}"
            mv "$f" "apk-out/WotaGeiCam-${base%.apk}-Android.apk"
            renamed=$((renamed + 1))
          done
          echo "renamed $renamed APK(s)"
          ls -la apk-out

      # 旧版兼容单枚（2026-11-09 用户裁决）：≤v0.0.12-r01 的更新器没有 flavor 概念，
# 只按「第一个含 universal 的资产」挑包；而 GitHub Release 的资产数组**按名字排序**返回
# （实测：legacy 组创建最早，id 最小，但仍排在 full 之后——上传顺序不影响挑选）。
# 所以兼容包必须起一个字母序最前的名字：`-compat-universal-release-Android.apk`
# （'c' < 'f'(full) < 'l'(lite)）——旧版段 1/2 必然挑到它。内容=lite（旧版功能集等于 lite），
# 正文通用 `SHA256:` 行回填的也正是 lite 哈希。
      - name: Stage legacy-compat APK (content = lite)
        run: |
          set -euo pipefail
          src=$(ls apk-out/WotaGeiCam-v*-lite-universal-release-Android.apk 2>/dev/null | head -n 1)
          if [ -z "$src" ]; then
            echo "::error::lite universal APK 缺失，无法生成旧版兼容包"
            ls -la apk-out
            exit 1
          fi
          dst="${src/-lite-universal-/-compat-universal-}"
          cp "$src" "$dst"
          cmp -s "$src" "$dst" || { echo "::error::compat copy differs: $dst"; exit 1; }
          echo "staged compat: $(basename "$dst")"
          ls -la apk-out

      - name: Verify APKs staged (full / lite × splits + compat)
        run: |
          ls -la apk-out
          # 9 枚口径（2026-11-09 用户裁决）：full 四件套 + lite 四件套 + 旧版兼容 compat 一枚。
          # docs/plan/33：各 flavor 的 split 三件套 + plain 一枚 = 4；
          # 名形 -<flavor>[-<abi>]-release-Android.apk → flavor 后还有 release 段，
          # 故 glob 必须用 *-$flavor-*-Android.apk（r05 复推踩过：旧双段名恰好让
          # *-$flavor-Android.apk 命中尾部 flavor，单段名后该模式恒 0 枚）。
          for flavor in full lite; do
            count=$(ls apk-out/*-$flavor-*-Android.apk 2>/dev/null | wc -l)
            if [ "$count" -ne 4 ]; then
              echo "::error::expected 4 $flavor APKs, got $count"
              exit 1
            fi
          done
          # 旧版兼容单枚（内容=lite，名字字母序最前：-compat- < -full- < -lite-）
          compat=$(ls apk-out/*-compat-universal-release-Android.apk 2>/dev/null | wc -l)
          if [ "$compat" -ne 1 ]; then
            echo "::error::expected 1 compat APK, got $compat"
            ls -la apk-out
            exit 1
          fi
          total=$(ls apk-out/*.apk 2>/dev/null | wc -l)
          if [ "$total" -ne 9 ]; then
            echo "::error::expected 9 staged APKs, got $total"
            ls -la apk-out
            exit 1
          fi
          # 最终名必须是 WotaGeiCam-v*-Android.apk（项目名是 10-25 用户裁决，不许再丢）
          bad=$(ls apk-out/*.apk | grep -Ev '/WotaGeiCam-v[^/]*-Android\.apk$' || true)
          if [ -n "$bad" ]; then
            echo "::error::non-conforming APK name(s): $bad"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.ref_name }}-apks
          path: |
            apk-out/*.apk
            Android/WotaGeiCamApp/app/build/outputs/mapping/fullRelease/mapping.txt
            Android/WotaGeiCamApp/app/build/outputs/mapping/liteRelease/mapping.txt
          if-no-files-found: error

      # 与 build-hap.yml 共用同一个 v* Release：谁先跑完谁创建，另一个只上传资产。
      # 发布说明来源（按优先级）：
      #   1) 仓库内 `.github/release-notes/<tag>.md`（如 v0.0.10-r01.md）——**推荐**：发版前写好
      #      并提交，随 tag 一起推，用户看到的就是这份手写说明；
      #   2) 没有该文件时退回 `--generate-notes`（只有 changelog 链接）。
      # 两条流水线并行，HAP 通常先跑完并创建 Release，APK 这步最后收口，故统一在此定稿 body。
      - name: Publish to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [ -f "$NOTES" ]; then
              gh release create "$GITHUB_REF_NAME" \
                --title "WotaGeiCam $GITHUB_REF_NAME" \
                --notes-file "$NOTES" \
                || gh release view "$GITHUB_REF_NAME" >/dev/null
            else
              echo "::warning::缺少 $NOTES，Release 说明将只有自动生成的 changelog"
              gh release create "$GITHUB_REF_NAME" \
                --title "WotaGeiCam $GITHUB_REF_NAME" \
                --generate-notes \
                || gh release view "$GITHUB_REF_NAME" >/dev/null
            fi
          fi
          # 上传（2026-11-09 9 枚口径）：compat 单枚先传、其余 8 枚后传（只影响 created_at，
          # 便于人工核对）。**旧版能选中 lite 内容靠的是名字字母序**（`-compat-` < `-full-` < `-lite-`
          # < `-universal-`），不是上传先后——GitHub 的 assets 数组按名字排序返回，实测传入顺序无效。
          shopt -s nullglob
          compat_files=(); rest=()
          for f in apk-out/*.apk; do
            case "$(basename "$f")" in
              *-compat-*) compat_files+=("$f") ;;
              *) rest+=("$f") ;;
            esac
          done
          if [ "${#compat_files[@]}" -ne 1 ]; then
            echo "::error::compat APK 组应为 1 枚，实为 ${#compat_files[@]}"
            ls -la apk-out
            exit 1
          fi
          for f in "${compat_files[@]}"; do
            gh release upload "$GITHUB_REF_NAME" "$f" --clobber
          done
          for f in "${rest[@]}"; do
            gh release upload "$GITHUB_REF_NAME" "$f" --clobber
          done

          # 应用内更新从 Release 说明的 SHA256 行取 universal 包的校验值
          # （UpdateChecker.parseSha256FromNotes，只认官方端点段 1 的 body）。CI 不能预先知道
          # 哈希，故构建完在此回填。**三行语义（2026-11-09 用户裁决）**：
          #   SHA256:      <compat 包哈希>——旧版更新器（≤v0.0.12-r01，无 flavor 概念）**唯一**认识
          #                的一行；旧版挑到的正是 compat 那枚（内容=lite），故它必须=lite 哈希。
          #   SHA256-full: <full universal 哈希>——full 变体专用行（只认本行，不回退通用行）。
          #   SHA256-lite: <lite universal 哈希>——lite 变体专用行（只认本行）。
          # 回填逻辑：以手写说明（若有）或现有 body 为底 → 去掉旧哈希行 → 追加本次三行。
          # 资产名形态：WotaGeiCam-v<tag>-<flavor|compat>[-<abi>]-release-Android.apk。
          # 定位不到或不一致就硬失败——绝不让空哈希/错配哈希进 Release 正文
          # （r05 首推踩过：模式写死单段名却匹配不到双段名，sha256sum '' 静默产出空行）。
          FULL_UNI=$(ls apk-out/*-full-universal-release-Android.apk 2>/dev/null | head -n 1)
          LITE_UNI=$(ls apk-out/*-lite-universal-release-Android.apk 2>/dev/null | head -n 1)
          COMPAT_UNI=$(ls apk-out/*-compat-universal-release-Android.apk 2>/dev/null | head -n 1)
          if [ -z "$FULL_UNI" ] || [ -z "$LITE_UNI" ] || [ -z "$COMPAT_UNI" ]; then
            echo "::error::universal APK 定位失败（full='$FULL_UNI' lite='$LITE_UNI' compat='$COMPAT_UNI'），哈希无法回填"
            ls -la apk-out
            exit 1
          fi
          cmp -s "$LITE_UNI" "$COMPAT_UNI" || {
            echo "::error::compat universal 与 lite universal 内容不一致"
            exit 1
          }
          SHA_FULL=$(sha256sum "$FULL_UNI" | cut -d' ' -f1)
          SHA_LITE=$(sha256sum "$LITE_UNI" | cut -d' ' -f1)
          SHA_COMPAT="$SHA_LITE"
          BODY=/tmp/release-body.md
          if [ -f "$NOTES" ]; then
            grep -vE '(^|[[:space:]>*-])SHA256(-full|-lite)?[[:space:]]*[:：]' "$NOTES" > "$BODY" || true
          else
            gh release view "$GITHUB_REF_NAME" --json body --jq '.body // ""' \
              | grep -vE '(^|[[:space:]>*-])SHA256(-full|-lite)?[[:space:]]*[:：]' > "$BODY" || true
          fi
          # 手写说明里若已带"校验和"小节标题就不再重复加，只补标签行
          if ! grep -qE '^##+ .*校验和' "$BODY"; then
            printf '\n## 校验和\n\n- 兼容旧版（=lite 内容）SHA256：\n- full 包 SHA256：\n- lite 包 SHA256：\n' >> "$BODY"
          else
            grep -q '兼容旧版（=lite 内容）SHA256' "$BODY" || printf '\n- 兼容旧版（=lite 内容）SHA256：\n' >> "$BODY"
            grep -q 'full 包 SHA256' "$BODY" || printf '\n- full 包 SHA256：\n' >> "$BODY"
            grep -q 'lite 包 SHA256' "$BODY" || printf '\n- lite 包 SHA256：\n' >> "$BODY"
          fi
          printf 'SHA256: %s\n' "$SHA_COMPAT" >> "$BODY"
          printf 'SHA256-full: %s\n' "$SHA_FULL" >> "$BODY"
          printf 'SHA256-lite: %s\n' "$SHA_LITE" >> "$BODY"
          gh release edit "$GITHUB_REF_NAME" --notes-file "$BODY"
          echo "release body finalized: compat(lite)=$SHA_COMPAT full=$SHA_FULL lite=$SHA_LITE"

