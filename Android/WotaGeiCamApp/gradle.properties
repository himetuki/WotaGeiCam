# 只替换 lint 工具版本，不改 AGP/构建产物：
# Compose runtime 1.6.8 与 lifecycle-livedata-core 2.8.2 随 AAR 发布的 lint.jar 在编译期
# 引用了 KtAnalysisSessionProvider.getTokenFactory()。AGP 8.1.1 自带的 lint 31.1.1 没有该 API，
# 两组库检查会被判为 ObsoleteLintCustomCheck 并整组跳过。lint 31.3.x～31.6.x 仍保留该 API，
# 31.7 起已改名为 KaSessionProvider；这里固定到最低兼容版本 31.3.1，让库检查真正执行。
# 注意该属性按 AGP 版本号填写（AGP 主版本 + 23 = lint 主版本），8.3.1 即 lint 31.3.1。
android.experimental.lint.version=8.3.1
